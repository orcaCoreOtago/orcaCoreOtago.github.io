project:
  type: website
  output-dir: _site
  # Builds the navbar menus from sops.yml before every render.
  pre-render: _scripts/build-nav.ts

# _nav.yml is generated by the script above. Do not edit it by hand.
metadata-files:
  - _nav.yml

website:
  title: "ORCA SOPs"
  site-url: https://orcacoreotago.github.io/
  description: "Standard operating procedures for the Otago Repository for Core Analysis (ORCA), University of Otago."
  page-footer:
    left: "ORCA Facility · University of Otago"
    right:
      - icon: github
        href: https://github.com/orcaCoreOtago

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: false
